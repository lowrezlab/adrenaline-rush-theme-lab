<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adrenaline Rush Theme Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=EB+Garamond:ital,wght@0,400;0,500;1,500&family=Geist:wght@400;500;600;700&family=Inter+Tight:wght@400;500;700&family=Manrope:wght@400;600;800&family=Roboto+Condensed:wght@400;600;700&family=Roboto:wght@400;700&family=Schibsted+Grotesk:wght@400;600;800&family=Space+Grotesk:wght@400;500;700&family=Syne:wght@600;800&family=Unbounded:wght@500;700;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<style>
/* ───────────── Lab chrome (neutral, never themed) ───────────── */
:root{
  --lab-bg:#e9e8ec; --lab-rail:#fbfbfc; --lab-ink:#18171c; --lab-muted:#6b6875; --lab-line:#dddbe2;
  --lab-accent:#be61a5; --lab-chip:#f1f0f4;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --lab-bg:#0e0d11; --lab-rail:#17161b; --lab-ink:#efedf3; --lab-muted:#9a97a3; --lab-line:#2a2830; --lab-chip:#222027;
  }
}
:root[data-theme="dark"]{ --lab-bg:#0e0d11; --lab-rail:#17161b; --lab-ink:#efedf3; --lab-muted:#9a97a3; --lab-line:#2a2830; --lab-chip:#222027; }
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--lab-bg);color:var(--lab-ink);font:14px/1.45 Geist,system-ui,sans-serif;display:flex;overflow:hidden}
button,select,input{font:inherit;color:inherit}
.rail{width:316px;flex:none;background:var(--lab-rail);border-right:1px solid var(--lab-line);overflow-y:auto;padding:18px 18px 40px}
.rail h1{font-size:15px;margin:0 0 2px;letter-spacing:-.01em}
.rail .sub{color:var(--lab-muted);font-size:12px;margin:0 0 18px}
.sec{margin:0 0 22px}
.sec>label,.sec>.lbl{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--lab-muted);margin:0 0 8px}
.themes{display:grid;gap:8px}
.tcard{display:grid;grid-template-columns:54px 1fr;gap:10px;align-items:center;text-align:left;background:var(--lab-chip);border:1.5px solid transparent;border-radius:10px;padding:8px;cursor:pointer}
.tcard:hover{border-color:var(--lab-line)}
.tcard[aria-pressed="true"]{border-color:var(--lab-ink)}
.tcard .sw{height:40px;border-radius:6px;display:grid;grid-template-columns:repeat(4,1fr);overflow:hidden;border:1px solid rgba(0,0,0,.08)}
.tcard b{display:block;font-size:13px}
.tcard small{display:block;color:var(--lab-muted);font-size:11.5px;line-height:1.3}
.seg{display:flex;background:var(--lab-chip);border-radius:9px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;padding:6px 4px;border-radius:7px;cursor:pointer;font-size:12.5px;color:var(--lab-muted)}
.seg button[aria-pressed="true"]{background:var(--lab-rail);color:var(--lab-ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 9px;font-size:13px}
.row select,.row input[type=range]{width:150px}
.row select{background:var(--lab-chip);border:1px solid var(--lab-line);border-radius:7px;padding:5px 6px}
.row input[type=color]{width:40px;height:26px;border:1px solid var(--lab-line);border-radius:6px;background:none;padding:1px;cursor:pointer}
.btn{width:100%;border:1px solid var(--lab-line);background:var(--lab-chip);border-radius:9px;padding:9px;cursor:pointer;font-weight:600;font-size:13px}
.btn.primary{background:var(--lab-ink);color:var(--lab-rail);border-color:var(--lab-ink)}
.btn+.btn{margin-top:8px}
.note{font-size:12px;color:var(--lab-muted);margin:8px 0 0}
.stage{flex:1;min-width:0;display:flex;gap:16px;padding:16px;overflow:hidden}
.pane{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px}
.pane-label{font-size:12px;color:var(--lab-muted);font-weight:500}
.device{flex:1;min-height:0;width:100%;display:flex;justify-content:center;overflow:hidden}
.frame{height:100%;overflow-y:auto;overflow-x:hidden;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.06);background:#fff}
.modal{position:fixed;inset:0;background:rgba(10,10,14,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal.open{display:flex}
.modal-card{background:var(--lab-rail);border-radius:14px;width:min(860px,100%);max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
.modal-head{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--lab-line)}
.modal-head h2{font-size:15px;margin:0;flex:1}
.modal-body{padding:16px;overflow:auto}
.modal-body pre{background:var(--lab-chip);border-radius:9px;padding:12px;font:12px/1.5 ui-monospace,Menlo,monospace;white-space:pre;overflow:auto;max-height:46vh;margin:0}
.modal-body p{margin:0 0 10px;color:var(--lab-muted);font-size:13px}
.tabsx{display:flex;gap:6px;margin:0 0 10px}
.tabsx button{border:1px solid var(--lab-line);background:none;border-radius:999px;padding:5px 11px;cursor:pointer;font-size:12.5px}
.tabsx button[aria-pressed="true"]{background:var(--lab-ink);color:var(--lab-rail)}
.icon-btn{border:1px solid var(--lab-line);background:var(--lab-chip);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12.5px}
@media (max-width:820px){
  body{flex-direction:column;overflow:auto;height:auto}
  .rail{width:auto;border-right:0;border-bottom:1px solid var(--lab-line)}
  .stage{height:85vh;padding:12px}
}

/* ───────────── Storefront (fully driven by theme variables) ───────────── */
.store{
  container:store/inline-size;
  min-height:100%;
  background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.store *{box-sizing:border-box}
.store a{color:inherit;text-decoration:none;cursor:pointer}
.store img{display:block;max-width:100%}
.store .h{font-family:var(--font-head);font-weight:var(--head-weight);text-transform:var(--head-case);letter-spacing:var(--head-track);line-height:1.02;color:var(--heading);margin:0}
.store .wrap{max-width:1240px;margin:0 auto;padding:0 32px}
.store .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.store .btn-p{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:var(--btn-radius);padding:14px 26px;font:600 14px/1 var(--font-body);letter-spacing:var(--btn-track);text-transform:var(--btn-case);cursor:pointer;transition:filter .15s,transform .15s}
.store .btn-p:hover{filter:brightness(1.08);transform:translateY(-1px)}
.store .btn-p:active,.store .btn-s:active,.store .chip:active{transform:scale(.98)}
.store .ph{font-size:18px;line-height:1}
.store .btn-s{display:inline-flex;align-items:center;justify-content:center;background:transparent;color:var(--text);border:1.5px solid var(--border-strong);border-radius:var(--btn-radius);padding:12.5px 24px;font:600 14px/1 var(--font-body);letter-spacing:var(--btn-track);text-transform:var(--btn-case);cursor:pointer}

/* promo bar */
.store .promo{background:var(--promo-bg);color:var(--promo-text);font-size:12.5px;font-weight:600;letter-spacing:.04em;overflow:hidden;white-space:nowrap}
.store .promo-inner{display:flex;justify-content:center;gap:28px;padding:9px 16px}
.store[data-promo="marquee"] .promo-inner{justify-content:flex-start;width:max-content;animation:marq 28s linear infinite}
@keyframes marq{to{transform:translateX(-50%)}}
.store .promo-inner span::before{content:"✦";margin-right:28px;opacity:.6}
.store .promo-inner span:first-child::before{display:none}
.store[data-promo="marquee"] .promo-inner span:first-child::before{display:inline}

/* header */
.store .hdr{background:var(--header-bg);color:var(--header-text);border-bottom:1px solid var(--header-line)}
.store .hdr-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:28px;padding-top:16px;padding-bottom:16px}
.store .logo{display:flex;align-items:center;background:var(--logo-plate);border-radius:var(--radius);padding:var(--logo-pad)}
.store .logo img{height:var(--logo-h);width:auto;filter:var(--logo-filter)}
.store .ftr-logo{filter:var(--footer-logo-filter)}
.store .search{display:flex;align-items:center;gap:10px;background:var(--search-bg);border:1px solid var(--search-line);border-radius:var(--btn-radius);padding:11px 16px;color:var(--header-muted);font-size:14px;max-width:460px;width:100%;justify-self:center}
.store .hdr-actions{display:flex;align-items:center;gap:20px;font-size:14px;font-weight:500}
.store .acct{display:flex;gap:7px;align-items:center}
.store .cart-pill{display:inline-flex;align-items:center;gap:8px;background:var(--cart-bg);color:var(--cart-text);border-radius:var(--btn-radius);padding:8px 14px;font-weight:600}
.store .cart-pill i{font-style:normal;background:var(--accent);color:var(--accent-ink);border-radius:999px;min-width:20px;height:20px;display:inline-grid;place-items:center;font-size:11px;padding:0 6px}
.store .nav{background:var(--nav-bg);color:var(--nav-text);border-bottom:1px solid var(--border)}
.store .nav ul{list-style:none;margin:0;display:flex;justify-content:var(--nav-align);gap:34px;padding-top:13px;padding-bottom:13px}
.store .nav a{white-space:nowrap;font-size:13px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;position:relative}
.store .nav a.on::after,.store .nav a:hover::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:2px;background:var(--accent)}
.store[data-header="centered"] .hdr-row{grid-template-columns:1fr auto 1fr}
.store[data-header="centered"] .search{order:-1;justify-self:start;max-width:260px}
.store[data-header="centered"] .hdr-actions{justify-content:flex-end}

/* hero variants */
.store .hero{position:relative;overflow:hidden;background:var(--hero-bg);color:var(--hero-text)}
.store .hero .h{color:inherit}
.store .hero-splat{background:#000 url(https://cdn11.bigcommerce.com/s-1sco5eyhmh/images/stencil/original/carousel/3/Banner_-_1.jpg?c=1) center/cover}
.store .hero-splat .wrap{min-height:440px;display:grid;place-items:center;text-align:center}
.store .neon-box{background:rgba(0,0,0,.72);padding:22px 30px;border-radius:4px}
.store .neon-box p{margin:0;font:600 30px/1.3 Roboto,sans-serif;color:#fff;text-shadow:0 0 8px #ff8cf0,0 0 18px #ff3ec8}
.store .hero-glow::before{content:"";position:absolute;inset:0 0 0 30%;background:url(https://cdn11.bigcommerce.com/s-1sco5eyhmh/images/stencil/original/carousel/3/Banner_-_1.jpg?c=1) 70% center/cover;-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 45%);mask-image:linear-gradient(90deg,transparent 0%,#000 45%)}
.store .hero-glow .wrap,.store .hero-type .wrap,.store .hero-split .wrap{position:relative;z-index:1}
.store .hero-copy{max-width:640px}
.store .hero-copy .h{font-size:clamp(38px,5cqi,68px);line-height:1.04}
.store .hero-copy p{font-size:18px;color:var(--hero-muted);max-width:460px;margin:20px 0 30px}
.store .hero-ctas{display:flex;gap:12px;flex-wrap:wrap}
.store .hero-glow .wrap{padding-top:88px;padding-bottom:88px}
.store .hero-glow .hero-copy{max-width:min(760px,62cqi)}
.store .hero-glow .hero-copy .h{font-size:clamp(32px,4.3cqi,58px)}
.store .hero-split .hero-copy .h{font-size:clamp(36px,4.2cqi,58px)}
.store .hero-split .wrap{display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:center;padding-top:70px;padding-bottom:70px}
.store .collage{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.store .collage img{border-radius:var(--radius);background:var(--img-bg);aspect-ratio:1;object-fit:cover;width:100%}
.store .collage img:first-child{grid-row:span 2;aspect-ratio:auto;height:100%}
.store .hero-type .wrap{padding-top:80px;padding-bottom:64px}
.store .hero-type .h{font-size:clamp(56px,10cqi,150px);line-height:1}
.store .hero-type .row2{display:flex;justify-content:space-between;align-items:end;gap:30px;margin-top:34px;flex-wrap:wrap}
.store .hero-type p{max-width:420px;margin:0;color:var(--hero-muted);font-size:17px}
.store .hero-drop .wrap{padding-top:40px;padding-bottom:40px;display:grid;grid-template-columns:1.2fr 1fr;grid-template-rows:540px;gap:20px}
.store .drop-main{background:var(--accent);color:var(--accent-ink);border-radius:var(--radius);padding:44px;display:flex;flex-direction:column;justify-content:space-between;min-height:440px}
.store .drop-main .h{font-size:clamp(54px,8.5cqi,120px);line-height:.88;color:inherit}
.store .drop-main p{margin:0 0 18px;font-weight:500;max-width:380px}
.store .drop-main .btn-p{background:var(--accent-ink);color:var(--accent);align-self:flex-start}
.store .drop-side{display:grid;grid-template-rows:repeat(2,minmax(0,1fr));gap:20px;min-height:0}
.store .drop-side figure{margin:0;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:8px;cursor:pointer;min-height:0}
.store .drop-side .fimg{border:var(--card-border);background:var(--img-bg);overflow:hidden;min-height:0}
.store .drop-side img{width:100%;height:100%;object-fit:cover}
.store .drop-side figcaption{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}

.store .hero-art .wrap{padding-top:28px;padding-bottom:28px}
.store .art-frame{position:relative;border-radius:var(--radius);overflow:hidden;aspect-ratio:16/7;background:#000 url(https://cdn11.bigcommerce.com/s-1sco5eyhmh/images/stencil/original/carousel/5/Banner_-_3.jpg?c=1) center/cover}
.store .art-frame::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.78) 0%,rgba(0,0,0,.35) 45%,transparent 70%)}
.store .art-copy{position:absolute;z-index:1;left:clamp(22px,5cqi,64px);top:50%;transform:translateY(-50%);max-width:44%;color:#f7f5f8}
.store .art-copy .h{color:#f7f5f8;font-size:clamp(30px,4.2cqi,58px);line-height:1.04}
.store .art-copy p{margin:16px 0 26px;font-size:17px;opacity:.85}


/* sections */
.store section.block{padding:72px 0}
.store .sec-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:0 0 30px}
.store .sec-head .h{font-size:clamp(30px,4cqi,48px)}
.store .link-u{font-weight:600;font-size:14px;border-bottom:1.5px solid currentColor;padding-bottom:2px}

/* product cards */
.store .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--grid-gap)}
.store .card{background:var(--card-bg);border:var(--card-border);border-radius:var(--radius);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .2s, box-shadow .2s}
.store[data-cards="lifted"] .card{box-shadow:var(--card-shadow)}
.store .card:hover{transform:translateY(-3px)}
.store[data-cards="lifted"] .card:hover{box-shadow:var(--card-shadow-hover)}
.store .card .img{position:relative;background:var(--img-bg);aspect-ratio:1;overflow:hidden}
.store[data-cards="flat"] .card .img{border-radius:var(--radius)}
.store .card .img img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.store .card:hover .img img{transform:scale(1.05)}
.store .quick{position:absolute;left:10px;right:10px;bottom:10px;opacity:0;transform:translateY(6px);transition:.2s}
.store .card:hover .quick{opacity:1;transform:none}
.store .quick .btn-p{width:100%;padding:11px}
.store .card .meta{padding:var(--card-pad);display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.store[data-cards="flat"] .card{background:transparent;border:0}
.store[data-cards="flat"] .card .meta{padding:12px 2px 0}
.store .card .nm{font-family:var(--card-font);font-weight:var(--card-weight);text-transform:var(--card-case);letter-spacing:var(--card-track);font-size:var(--card-size);line-height:1.15;color:var(--heading)}
.store .card .br{font-size:12px;color:var(--muted);margin-top:3px}
.store .card .pr{font-weight:700;font-size:15px;white-space:nowrap}

/* bundle band */
.store .bundle{background:var(--band-bg);color:var(--band-text)}
.store .bundle .wrap{display:grid;grid-template-columns:1fr 1.25fr;gap:56px;align-items:center;padding-top:70px;padding-bottom:70px}
.store .bundle .h{color:inherit;font-size:clamp(30px,3.6cqi,46px)}
.store .bundle p{opacity:.8;margin:16px 0 0;max-width:400px}
.store .tiers{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:14px;align-items:stretch}
.store .tier{border:1.5px solid var(--band-line);border-radius:var(--radius);padding:24px 20px}
.store .tier.hot{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);padding:30px 26px}
.store .tier.hot .big{font-size:58px}
.store .tier .q{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.store .tier .big{font-family:var(--font-head);font-weight:var(--head-weight);font-size:44px;line-height:1;margin:12px 0 6px;letter-spacing:var(--head-track)}
.store .tier .each{font-size:13.5px;opacity:.85}

/* story + newsletter */
.store .story .wrap{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.store .story-img{border-radius:var(--radius);overflow:hidden;background:var(--img-bg);aspect-ratio:5/4;display:grid;grid-template-columns:1fr 1fr;gap:4px}
.store .story-img img{width:100%;height:100%;object-fit:cover}
.store .story .h{font-size:clamp(30px,4cqi,48px)}
.store .story p{color:var(--muted);font-size:16.5px;margin:18px 0 0}
.store .news{background:var(--surface-2);border-top:1px solid var(--border)}
.store .news .wrap{display:flex;justify-content:space-between;align-items:center;gap:30px;padding-top:48px;padding-bottom:48px;flex-wrap:wrap}
.store .news .h{font-size:28px}
.store .news form{flex:1;max-width:480px}
.store .field{display:grid;gap:8px}
.store .field label{font-size:13px;font-weight:600;color:var(--text)}
.store .field-row{display:flex;gap:10px}
.store .news input:focus{outline:2px solid var(--accent-strong);outline-offset:2px}
.store .news input{flex:1;min-width:0;background:var(--input-bg);border:1.5px solid var(--border-strong);border-radius:var(--btn-radius);padding:13px 16px;color:var(--text)}

/* footer */
.store .ftr{background:var(--footer-bg);color:var(--footer-text);padding:60px 0 28px}
.store .ftr-grid{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:36px}
.store .ftr h5{margin:0 0 14px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--footer-head)}
.store .ftr ul{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14px;opacity:.85}
.store .ftr .addr{font-size:14px;opacity:.75;margin-top:16px}
.store .ftr-bottom{display:flex;justify-content:space-between;gap:16px;border-top:1px solid var(--footer-line);margin-top:44px;padding-top:22px;font-size:12.5px;opacity:.65;flex-wrap:wrap}

/* category page */
.store .crumbs{font-size:13px;color:var(--muted);padding-top:26px}
.store .crumbs a:hover{color:var(--text)}
.store .cat-head{display:flex;justify-content:space-between;align-items:end;gap:24px;padding-top:14px;padding-bottom:28px;border-bottom:1px solid var(--border);margin-bottom:24px;flex-wrap:wrap}
.store .cat-head .h{font-size:clamp(44px,7cqi,88px)}
.store .cat-head p{color:var(--muted);margin:10px 0 0;max-width:520px}
.store .toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:26px;flex-wrap:wrap}
.store .chips{display:flex;gap:8px;flex-wrap:wrap}
.store .chip{border:1.5px solid var(--border-strong);background:transparent;color:var(--text);border-radius:var(--btn-radius);transition:background-color .15s,transform .15s;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer}
.store .chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.store .sort{font-size:13px;color:var(--muted)}
.store .sort select{background:var(--input-bg);color:var(--text);border:1px solid var(--border-strong);border-radius:calc(var(--btn-radius) / 2 + 4px);padding:7px 10px;margin-left:6px}

/* product page */
.store .pdp{display:grid;grid-template-columns:1.1fr 1fr;gap:56px;padding-top:20px;padding-bottom:70px}
.store .gallery .main{border-radius:var(--radius);overflow:hidden;background:var(--img-bg);aspect-ratio:1}
.store .gallery .main img{width:100%;height:100%;object-fit:cover}
.store .thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}

const P = [
  ['watermelon-z','Watermelon Z','WZ-35','124/400/Watermelon_Z_-_1_New__34145.1789500380.jpg',['Fruit','Candy'],'Watermelon Z smells like watermelon candy, fruit chews and sugary tropical punch. The sweetness is thick and syrupy, with a smooth candy finish that hangs around after every hit. It is one of those strains you can smell and immediately understand the name: juicy, sweet and unmistakably Z-forward.'],
  ['petro-chem','Petro Chem','PC-35','123/398/Petro_Chem_-_1_New__95556.1789500332.jpg',['Gas'],'Petro Chem is straight fuel. Heavy diesel, chemical funk and sharp gas dominate the nose, backed by a subtle earthy sweetness that rounds everything out. Crack the buds open and the aroma gets even louder, with that unmistakable garage-and-gas-station funk serious gas lovers look for.'],
  ['cherry-tarts','Cherry Tarts','CT-35','122/396/Cherry_Tarts_-_1_New__28202.1789500281.jpg',['Fruit','Dessert'],'Cherry Tarts is all about sweet cherry candy and rich dessert terps. Think cherry filling, red gummy candy and a soft baked-goods sweetness underneath. Sweet cherry up front, creamy dessert on the back end.'],
  ['dante-s-candy',"Dante's Candy",'DC-35','121/394/Dantes_Candy_-_1_New__32143.1789500224.jpg',['Candy'],"Dante's Candy is a true candy strain: berry candy, creamy vanilla, sugary dough and Runtz-style sweetness all packed together. The nose is soft, sweet and almost frosting-like, while a little underlying gas gives the flower some depth."],
  ['eastbound','Eastbound','EB-35','120/392/East_Bound_-_1_New__83982.1789500169.jpg',['Dessert','Gas'],'Eastbound brings a deeper, funkier profile with sweet cream, doughy undertones and a noticeable layer of gas. Rather than being overly fruity, it has a rich, savory sweetness that becomes more pronounced when the flower is broken apart.'],
  ['zuyaquii','Zuyaquii','ZQ-35','119/390/Zuyaqui_-_1_New__80692.1789500118.jpg',['Gas','Earthy'],'Zuyaqui stands apart from the sweeter strains in the lineup. It has a deep OG-style funk with woody, earthy and fuel-heavy aromas, plus a subtle creamy sweetness underneath.'],
  ['alien-vortex','Alien Vortex','AV-35','118/388/Alien_Vortex_-_1_New__06162.1789500044.jpg',['Fruit','Gas'],'Alien Vortex has a wild combination of sweet fruit, sour candy and heavy skunky gas. The sweetness comes first, followed by a funky fuel note that gives it much more depth than a typical candy strain.'],
  ['blue-guava','Blue Guava','BG-35','117/386/Blue_Guava_-_1_New__09743.1789499992.jpg',['Fruit'],'Blue Guava is ripe tropical fruit, blueberry sweetness and creamy guava candy. It has that juicy, almost smoothie-like aroma where the fruit smells thick rather than sharp. Tropical, creamy and seriously flavorful.'],
  ['fire-af','Fire AF','FA-35','116/384/Fire_AF_-_1_New__16938.1789499891.jpg',['Dessert','Gas'],'Fire AF combines sweet Gelato creaminess with fruity candy and heavy fuel. Think creamy candy terps with a gasoline finish. Sweet enough for the candy crowd but still loud enough for gas smokers.'],
  ['rock-candy','Rock Candy','RC-35','115/382/Rock_Candy_-_1_New__48883.1789499786.jpg',['Candy'],'Rock Candy is exactly the direction the name suggests: hard candy sweetness, sugary fruit and creamy undertones, with a touch of gas underneath to keep it from becoming one-dimensional.'],

/* ───────────── Themes ─────────────
   Each theme = token set + layout flags. Tokens map 1:1 to CSS variables on .store
   and to Stencil config keys on export. */
const FONTS = {

  'Schibsted Grotesk':"'Schibsted Grotesk',sans-serif", 'DM Sans':"'DM Sans',sans-serif", 'EB Garamond':"'EB Garamond',serif", 'Inter Tight':"'Inter Tight',sans-serif",
  'Bricolage Grotesque':"'Bricolage Grotesque',sans-serif", 'Anton':"Anton,sans-serif", 'Space Grotesk':"'Space Grotesk',sans-serif", 'Syne':"Syne,sans-serif", 'Manrope':"Manrope,sans-serif",
};
const HEAD_WEIGHT = {'Roboto Condensed':700,'Roboto':700,'Unbounded':700,'Geist':700,'Schibsted Grotesk':800,'DM Sans':700,'EB Garamond':500,'Inter Tight':700,'Bricolage Grotesque':800,'Anton':400,'Space Grotesk':700,'Syne':800,'Manrope':800};
const SERIF = f => f==='EB Garamond';

const THEMES = {
  original:{name:'Current site',blurb:'Baseline: your live purple / black setup, for reference.',
    t:{bg:'#000000',surface:'#111111',text:'#ffffff',muted:'#b9b9b9',heading:'#ffffff',accent:'#be61a5',accentInk:'#ffffff',
       header:'#be61a5',headerText:'#ffffff',navBg:'#ffffff',navText:'#333333',promoBg:'#000000',promoText:'#ffffff',
       footer:'#000000',footerText:'#ffffff',imgBg:'#ffffff',band:'#be61a5',bandText:'#ffffff',radius:0,
       head:'Roboto Condensed',body:'Roboto',case:'uppercase',track:'0',cards:'bordered',hero:'splat',header_layout:'classic',promo:'static',cardBg:'#ffffff',cardText:'#000000'}},

       head:'EB Garamond',body:'Inter Tight',case:'none',track:'-0.02em',cards:'flat',hero:'type',header_layout:'centered',promo:'static',cardBg:'#fbfbfa',cardText:'#141414'}},

/* ───────────── Color helpers ───────────── */
const hex2rgb = h => { h=h.replace('#',''); if(h.length===3) h=[...h].map(c=>c+c).join(''); const n=parseInt(h,16); return [n>>16&255,n>>8&255,n&255]; };
const rgb2hex = ([r,g,b]) => '#'+[r,g,b].map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');
const mix = (a,b,w) => { const A=hex2rgb(a),B=hex2rgb(b); return rgb2hex(A.map((v,i)=>v*(1-w)+B[i]*w)); };
const lum = h => { const c=hex2rgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)}); return .2126*c[0]+.7152*c[1]+.0722*c[2]; };
const isDark = h => lum(h) < .2;
const contrast = (a,b) => { const [x,y]=[lum(a),lum(b)].sort((m,n)=>n-m); return (x+.05)/(y+.05); };

/* resolve a theme + user tweaks into the full token set */
function resolve(key){
  const t = {...THEMES[key].t, ...(state.tweaks[key]||{})};
  // tweaks saved before a font was retired fall back to the theme's own font
  if(!FONTS[t.head]) t.head = THEMES[key].t.head;
  if(!FONTS[t.body]) t.body = THEMES[key].t.body;
  const dark = isDark(t.bg);
  // when header colour is tweaked, keep header text legible
  const headerText = (state.tweaks[key]||{}).header ? (isDark(t.header) ? '#ffffff' : '#111111') : t.headerText;
  const accentInk = (state.tweaks[key]||{}).accent ? (contrast(t.accent,'#ffffff') >= 3 ? '#ffffff' : '#0a0a0a') : t.accentInk;
  // if the user changed the background, re-derive text so it stays readable
  const bgTweaked = (state.tweaks[key]||{}).bg !== undefined;
  const text = bgTweaked ? (dark ? '#f2f0f4' : '#151515') : t.text;
  const heading = bgTweaked ? text : t.heading;
  const muted = bgTweaked ? mix(text, t.bg, .42) : t.muted;
  const surface = bgTweaked ? mix(t.bg, dark ? '#ffffff' : '#000000', .04) : t.surface;
  const cardBg = bgTweaked && key !== 'original' ? surface : t.cardBg;
  // accent tuned for small text on the page background
  const accentStrong = contrast(t.accent, t.bg) >= 4.5 ? t.accent : (dark ? mix(t.accent,'#ffffff',.35) : mix(t.accent,'#000000',.4));
  return {...t, text, heading, muted, surface, cardBg, headerText, accentInk, accentStrong, dark,
    border: mix(t.bg, text, dark ? .14 : .12), borderStrong: mix(t.bg, text, dark ? .32 : .28),
    surface2: mix(t.bg, text, dark ? .035 : .025)};
}

/* ───────────── Render ───────────── */
const DEV = {desktop:1280, tablet:820, mobile:390};
const stage = document.getElementById('stage');

function render(){
  const keys = [state.current, ...(state.compare && state.compare!==state.current ? [state.compare] : [])];
  const scrolls = [...stage.querySelectorAll('.frame')].map(f=>f.scrollTop);
  stage.innerHTML = keys.map((k,i)=>`<div class="pane"><div class="pane-label">${THEMES[k].name}${keys.length>1?(i===0?' · editing':''):''}</div><div class="device"><div class="frame" data-k="${k}"></div></div></div>`).join('');
  stage.querySelectorAll('.frame').forEach((f,i)=>{
    const k=f.dataset.k; const {r,html}=storeHTML(k);
    const s=document.createElement('div'); s.className='store';
    Object.entries(cssVars(r,k)).forEach(([n,v])=>s.style.setProperty(n,v));
    s.dataset.cards=r.cards; s.dataset.header=r.header_layout; s.dataset.promo=r.promo;
    s.innerHTML=html; f.appendChild(s);
    f.style.width = DEV[state.device]+'px';
    f.scrollTop = scrolls[i]||0;
  });
  fit(); syncControls(); save();
}

function fit(){
  stage.querySelectorAll('.frame').forEach(f=>{
    const avail = f.parentElement.clientWidth;
    const w = DEV[state.device];
    const z = Math.min(1, avail / w);
    f.style.zoom = z;
    f.style.height = (f.parentElement.clientHeight / z) + 'px';
  });
}
window.addEventListener('resize', fit);

/* store interactions (shared by both panes) */
stage.addEventListener('click', e=>{
  const add=e.target.closest('[data-add]');
  if(add){ e.stopPropagation(); const n=+(stage.querySelector('#qn')?.textContent||1); state.cart+= (state.page==='product'?n:1); showToast(add.dataset.add); save(); return; }
  const q=e.target.closest('[data-q]');
  if(q){ stage.querySelectorAll('#qn').forEach(el=>el.textContent=Math.max(1,+el.textContent + +q.dataset.q)); return; }
  const f=e.target.closest('[data-filter]'); if(f){ state.filter=f.dataset.filter; render(); return; }
  const pr=e.target.closest('[data-prod]'); if(pr){ state.product=pr.dataset.prod; state.page='product'; render(); stage.querySelectorAll('.frame').forEach(x=>x.scrollTop=0); return; }
  const g=e.target.closest('[data-go]'); if(g){ state.page=g.dataset.go; render(); stage.querySelectorAll('.frame').forEach(x=>x.scrollTop=0); }
});

function showToast(slug){
  const p=P.find(x=>x.slug===slug); const c=state.cart;
  const next = c<4 ? `Add ${4-c} more to save 15%` : c<8 ? `You’re saving 15%. Add ${8-c} more to save 25%` : 'You’re saving 25% on this order';
  const pct = Math.min(100, c/8*100);
  stage.querySelectorAll('.store').forEach(s=>{
    s.querySelectorAll('.cart-pill i').forEach(i=>i.textContent=c);
    const t=s.querySelector('.toast');
    t.innerHTML=`<div class="t1"><img src="${img(p,'300x300')}" alt=""><div><b>${p.name}</b><small>Added to cart · ${c} item${c>1?'s':''}</small></div></div>
      <div class="prog"><i style="width:${pct}%"></i></div><div class="msg">${next}</div>`;
    t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),3200);
  });
}

themeList.innerHTML = Object.entries(THEMES).map(([k,th])=>{
  const t=th.t; return `<button class="tcard" data-k="${k}"><span class="sw">${[t.bg,t.header,t.accent,t.band].map(c=>`<i style="background:${c}"></i>`).join('')}</span>

themeList.addEventListener('click',e=>{const b=e.target.closest('.tcard'); if(!b) return; state.current=b.dataset.k; if(state.compare===state.current) state.compare=''; render();});

['tw-head','tw-body'].forEach(id=>$(id).innerHTML=Object.keys(FONTS).map(f=>`<option>${f}</option>`).join(''));

const TW = {'tw-accent':'accent','tw-bg':'bg','tw-header':'header','tw-radius':'radius','tw-head':'head','tw-body':'body','tw-case':'case','tw-cards':'cards','tw-hero':'hero'};
Object.entries(TW).forEach(([id,key])=>{

function syncControls(){
  themeList.querySelectorAll('.tcard').forEach(b=>b.setAttribute('aria-pressed', b.dataset.k===state.current));
  $('pageSeg').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.v===state.page));
  $('devSeg').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.v===state.device));
  $('compareSel').value = state.compare||'';
  const r = resolve(state.current);
  Object.entries(TW).forEach(([id,key])=>{ if(document.activeElement!==$(id)) $(id).value = r[key]; });
  const n = Object.keys(state.tweaks[state.current]||{}).length;
  $('twNote').textContent = n ? `${n} tweak${n>1?'s':''} saved on ${THEMES[state.current].name}. Tweaks stay in this browser and are included in the export.` : 'Changes apply to the selected theme only.';

.lab-promo-items{ display:flex; align-items:center; justify-content:space-around; min-width:100vw; margin:0; padding:0; list-style:none; }
.lab-promo-items li{ padding:0 22px; white-space:nowrap; }

PART A: IN THE CONTROL PANEL (no software needed)

1. Go to Storefront › Themes.

PART B: FOR A DEVELOPER (Stencil CLI)

1. Create a token: Settings › Store-level API accounts › "+ Create API Account".

2. Download the theme: Storefront › Themes › ⋯ on your current theme ›

3. Install and connect (run these one at a time):
     npm install -g @bigcommerce/stencil-cli
